<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save the Date — Shantanu &amp; Pragati</title>
<style>
  @font-face { font-family: "Ivy"; src: url(assets/fonts/IvyOraDisplay-Regular.woff2); font-weight: 400; }
  @font-face { font-family: "Ivy"; src: url(assets/fonts/IvyOraDisplay-Medium.woff2); font-weight: 500; }
  @font-face { font-family: "Ivy"; src: url(assets/fonts/IvyOraDisplay-Bold.woff2); font-weight: 700; }
  @font-face { font-family: "Sig"; src: url(assets/fonts/BrotherSignature.woff2); }
  @font-face { font-family: "Gotham"; src: url(assets/fonts/Gotham-Light.woff2); font-weight: 300; }
  @font-face { font-family: "Gotham"; src: url(assets/fonts/Gotham-Book.woff2); font-weight: 400; }
  @font-face { font-family: "Gotham"; src: url(assets/fonts/Gotham-Medium.woff2); font-weight: 500; }

  :root {
    --cream: #FFEFE0;
    --copper: #AB5626;
    --gold: #DDA45D;
    --brown: #5F250F;
    --gold-deep: #B9853F;
  }
  html, body { margin: 0; padding: 0; background: var(--cream); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
  .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; display: none; }
  .abs { position: absolute; left: 0; top: 0; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  img { display: block; user-select: none; }
  .center { position: absolute; left: 0; width: 1080px; text-align: center; }
  .ivy { font-family: "Ivy", serif; }
  .sig { font-family: "Sig", cursive; }
  .gotham { font-family: "Gotham", sans-serif; }
  .glow { text-shadow: 0 0 28px rgba(255, 244, 232, .95), 0 0 10px rgba(255, 244, 232, .9); }
  .caps { text-transform: uppercase; }
  .nowrap { white-space: nowrap; }

  /* the event card */
  .card { position: absolute; }
  .card svg.frame { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
  .card .inner { position: absolute; left: 50%; top: 50%; width: 596px; height: 857px; transform-origin: 0 0; }
  .card .inner > * { position: absolute; left: 0; width: 596px; text-align: center; }

  .chip { display: inline-flex; align-items: center; gap: 14px; padding: 16px 34px; border-radius: 999px;
          font-family: "Gotham", sans-serif; font-weight: 500; color: var(--brown); white-space: nowrap; }
  .chip.final { background: var(--copper); color: #FFF6EC; }
  .chip.todo { border: 4px dashed var(--copper); background: repeating-linear-gradient(-45deg, #FFF3E2 0 18px, #FBE6CC 18px 36px); }
  .todo-tag { display: inline-block; font-family: "Gotham", sans-serif; font-weight: 500; font-size: 22px; letter-spacing: .14em;
              color: #FFF6EC; background: #C0392B; padding: 6px 14px; border-radius: 8px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="config.js"></script>
<script src="scene.js"></script>
</body>
</html>
